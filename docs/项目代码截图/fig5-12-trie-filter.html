<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图5-12 敏感词过滤处理流程图</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
body { font-family: 'SimSun', serif; padding: 20px; background: #fff; }
.chart-container { background: white; padding: 15px; max-width: 520px; margin: 0 auto; border: 1px solid #ccc; }
h2 { text-align: center; font-size: 15px; color: #000; margin-bottom: 10px; font-weight: bold; }
.mermaid { display: flex; justify-content: center; }
.mermaid svg { max-width: 500px !important; }
</style>
</head>
<body>
<div class="chart-container">
<h2>图5-12 敏感词过滤处理流程图</h2>
<div class="mermaid">
flowchart TD
    A(["开始"]) --> B["用户发表评论<br/>输入评论内容文本"]
    B --> C["逐字符扫描Trie树<br/>同时匹配多条路径"]
    C --> D{匹配到<br/>敏感词结尾?}
    D -->|命中| E["替换为 *** 并跳过<br/>继续扫描后续字符"]
    E --> F{是否<br/>扫描完?}
    D -->|未命中| G["保留原字符<br/>继续下一字符"]
    G --> F
    F -->|否| C
    F -->|是| H["输出过滤后的安全文本<br/>或阻止提交并提示"]
    H --> I(["结束"])
</div>
<p style="text-align:center;font-size:12px;color:#666;">时间复杂度 O(k)，k为文本长度，与敏感词数量无关</p>
</div>
<script>
mermaid.initialize({ startOnLoad: true, theme: 'base',
  themeVariables: { primaryColor:'#fff',primaryBorderColor:'#000',primaryTextColor:'#000',lineColor:'#000',fontSize:'13px',fontFamily:'SimSun' },
  flowchart: { useMaxWidth:false, htmlLabels:true, curve:'linear', nodeSpacing:22, rankSpacing:30, padding:8 } });
</script>
</body>
</html>
