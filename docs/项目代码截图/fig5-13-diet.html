<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图5-13 饮食记录流程图</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
body { font-family: 'SimSun', serif; padding: 20px; background: #fff; }
.chart-container { background: white; padding: 15px; max-width: 520px; margin: 0 auto; border: 1px solid #ccc; }
h2 { text-align: center; font-size: 15px; color: #000; margin-bottom: 10px; font-weight: bold; }
.mermaid { display: flex; justify-content: center; }
.mermaid svg { max-width: 500px !important; }
</style>
</head>
<body>
<div class="chart-container">
<h2>图5-13 饮食记录流程图</h2>
<div class="mermaid">
flowchart TD
    A(["开始"]) --> B["选择餐次<br/>早餐/午餐/晚餐"]
    B --> C["填写食物信息<br/>名称+热量+分量"]
    C --> D{"是否<br/>继续添加?"}
    D -->|是| C
    D -->|否| E["POST /diet-history/save<br/>批量保存多条记录"]
    E --> F["my-diet页面展示<br/>每日饮食记录列表"]
    F --> G["统计每日总热量摄入"]
    G --> H(["结束"])
</div>
</div>
<script>
mermaid.initialize({ startOnLoad: true, theme: 'base',
  themeVariables: { primaryColor:'#fff',primaryBorderColor:'#000',primaryTextColor:'#000',lineColor:'#000',fontSize:'13px',fontFamily:'SimSun' },
  flowchart: { useMaxWidth:false, htmlLabels:true, curve:'linear', nodeSpacing:25, rankSpacing:35, padding:8 } });
</script>
</body>
</html>
