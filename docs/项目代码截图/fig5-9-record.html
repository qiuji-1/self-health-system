<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图5-9 健康数据录入流程图</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
body { font-family: 'SimSun', serif; padding: 20px; background: #fff; }
.chart-container { background: white; padding: 15px; max-width: 520px; margin: 0 auto; border: 1px solid #ccc; }
h2 { text-align: center; font-size: 15px; color: #000; margin-bottom: 10px; font-weight: bold; }
.mermaid { display: flex; justify-content: center; }
.mermaid svg { max-width: 500px !important; }
</style>
</head>
<body>
<div class="chart-container">
<h2>图5-9 健康数据录入流程图</h2>
<div class="mermaid">
flowchart TD
    A(["开始"]) --> B["选择录入的健康模组<br/>下拉选择器"]
    B --> C["动态渲染对应表单<br/>仅显示已选指标的输入框"]
    C --> D["逐项填写各指标数值"]
    D --> E["batchSave批量保存<br/>写入health_record表"]
    E --> F["根据阈值自动判断<br/>min &lt; value &lt; max → 正常"]
    F --> G["表格展示记录结果<br/>绿色'正常'/红色'异常'"]
    G --> H(["结束"])
</div>
</div>
<script>
mermaid.initialize({ startOnLoad: true, theme: 'base',
  themeVariables: { primaryColor:'#fff',primaryBorderColor:'#000',primaryTextColor:'#000',lineColor:'#000',fontSize:'13px',fontFamily:'SimSun' },
  flowchart: { useMaxWidth:false, htmlLabels:true, curve:'linear', nodeSpacing:23, rankSpacing:33, padding:8 } });
</script>
</body>
</html>
