<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图5-8 健康模组配置流程图</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
body { font-family: 'SimSun', serif; padding: 20px; background: #fff; }
.chart-container { background: white; padding: 15px; max-width: 520px; margin: 0 auto; border: 1px solid #ccc; }
h2 { text-align: center; font-size: 15px; color: #000; margin-bottom: 10px; font-weight: bold; }
.mermaid { display: flex; justify-content: center; }
.mermaid svg { max-width: 500px !important; }
</style>
</head>
<body>
<div class="chart-container">
<h2>图5-8 健康模组配置流程图</h2>
<div class="mermaid">
flowchart TD
    A(["开始"]) --> B["管理员预设指标池<br/>定义名称/单位/正常值范围<br/>（身高/体重/血压/心率...）"]
    B --> C["GET /health-model/optionsUser<br/>加载公共模组下拉选项"]
    C --> D["用户从池中选择指标项<br/>✅身高 ✅体重 ✅心率（自选组合）"]
    D --> E["POST /health-model/save<br/>保存个人健康模型配置"]
    E --> F["动态生成录入表单<br/>仅显示已选指标的输入框"]
    F --> G(["完成"])
</div>
</div>
<script>
mermaid.initialize({ startOnLoad: true, theme: 'base',
  themeVariables: { primaryColor:'#fff',primaryBorderColor:'#000',primaryTextColor:'#000',lineColor:'#000',fontSize:'13px',fontFamily:'SimSun' },
  flowchart: { useMaxWidth:false, htmlLabels:true, curve:'linear', nodeSpacing:22, rankSpacing:32, padding:8 } });
</script>
</body>
</html>
